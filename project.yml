name: LivePhotoConverter
options:
  bundleIdPrefix: com.jim
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LivePhotoConverter:
    type: application
    platform: macOS
    sources:
      - path: LivePhotoConverter/Sources
      - path: LivePhotoConverter/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jim.LivePhotoConverter
        INFOPLIST_FILE: LivePhotoConverter/Info.plist
        CODE_SIGN_ENTITLEMENTS: LivePhotoConverter/LivePhotoConverter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "0.1.0"
    entitlements:
      path: LivePhotoConverter/LivePhotoConverter.entitlements
